[package]
name = "scanr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Static analysis and search for TypeScript and JavaScript"
license-file = "LICENSE"
repository = "https://github.com/nikuscs/scanr"
readme = "README.md"
keywords = ["search", "static-analysis", "typescript", "javascript", "codebase"]
categories = ["command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Parallelism
rayon = "1.10"

# JS/TS semantic analysis (scan module)
oxc = { version = "0.123", features = ["semantic", "ast_visit"] }

# File walking and content search
ignore = "0.4"
fff-grep = "0.10.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
future_not_send = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
format_push_string = "allow"
return_self_not_must_use = "allow"
unnecessary_debug_formatting = "allow"
# Strict denials:
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
